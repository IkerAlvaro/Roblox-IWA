<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0c10" />
    <title>Roblox IWA</title>
    <link rel="manifest" href="/.well-known/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { --red:#e2231a; --red2:#ff5a3c; --bg:#0b0c10; --panel:#14161e; --line:#2a2e3a; --muted:#9aa3b5; --text:#f5f7fb; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background:
        radial-gradient(900px 380px at 100% 0%, rgba(226,35,26,.22), transparent 55%),
        radial-gradient(700px 320px at 0% 100%, rgba(70,80,200,.14), transparent 50%),
        var(--bg); color: var(--text); font-family: system-ui, "Segoe UI", sans-serif; }
      #app { display: flex; height: 100%; }
      .rail { width: 78px; flex: 0 0 78px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; background: rgba(12,13,18,.9); border-right: 1px solid var(--line); }
      .rail img { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; display: block; }
      .rail button { width: 46px; height: 46px; border: 0; border-radius: 14px; background: transparent; color: #fff; cursor: pointer; font-size: 18px; }
      .rail button:hover { background: #232633; }
      .rail button.active { background: linear-gradient(180deg, var(--red2), var(--red)); }
      .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
      .topbar { display: flex; gap: 12px; padding: 14px 18px; align-items: center; }
      #go-form { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 16px; }
      #url { flex: 1; border: 0; background: transparent; color: #fff; outline: none; font-size: 15px; }
      .pill, .btn { border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; font-weight: 700; background: linear-gradient(90deg, var(--red), var(--red2)); color: #fff; }
      .ghost { background: #2a2e3a; }
      #clock { color: var(--muted); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
      main { flex: 1; min-height: 0; margin: 0 16px 10px; border: 1px solid var(--line); border-radius: 20px; position: relative; overflow: auto; background: rgba(16,18,26,.72); }
      #splash { padding: 22px; }
      .hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; padding: 26px; border-radius: 18px; background:
        linear-gradient(115deg, rgba(226,35,26,.2), transparent 42%), var(--panel); border: 1px solid var(--line); }
      .hero img { width: 112px; height: 112px; border-radius: 28px; object-fit: cover; }
      .kicker { margin: 0 0 6px; letter-spacing: .16em; text-transform: uppercase; font-size: 11px; color: #ffb4a8; }
      h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 40px); letter-spacing: -.03em; }
      p { color: var(--muted); line-height: 1.5; margin: 0; max-width: 52ch; }
      .cta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
      .stats { display: flex; gap: 18px; margin-top: 16px; color: var(--muted); font-size: 13px; }
      .stats b { color: var(--text); }
      .section { margin: 22px 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
      .card { text-align: left; color: #fff; cursor: pointer; border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-height: 118px; background: #1b1e29; }
      .card:hover { border-color: rgba(226,35,26,.5); }
      .card i { display: block; width: 28px; height: 4px; border-radius: 4px; background: var(--red); margin-bottom: 10px; }
      .card span { display: block; color: #ffb4a8; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
      .card strong { display: block; margin: 6px 0 4px; font-size: 18px; }
      .card em { color: var(--muted); font-style: normal; font-size: 13px; }
      iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
      footer { padding: 6px 18px 12px; color: var(--muted); font-size: 12px; }
      @media (max-width: 700px) {
        #app { flex-direction: column; }
        .rail { flex-direction: row; width: 100%; height: 60px; flex: none; border-right: 0; border-bottom: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="rail">
        <button type="button" id="home-btn" title="Launcher"><img src="/icons/icon-192.png" width="42" height="42" alt="Roblox IWA" /></button>
        <button type="button" class="active" data-url="https://www.roblox.com/home" title="Inicio">⌂</button>
        <button type="button" data-url="https://www.roblox.com/discover" title="Descubrir">◇</button>
        <button type="button" data-url="https://www.roblox.com/charts" title="Populares">▲</button>
        <button type="button" data-url="https://www.roblox.com/catalog" title="Avatar">☺</button>
        <button type="button" data-url="https://www.roblox.com/develop" title="Crear">＋</button>
      </aside>
      <div class="stage">
        <header class="topbar">
          <form id="go-form">
            <input id="url" type="search" placeholder="Buscar experiencias o pegar una URL de roblox.com" />
            <button class="pill" type="submit">Ir</button>
          </form>
          <div id="clock"></div>
        </header>
        <main>
          <section id="splash">
            <div class="hero">
              <img src="/icons/icon-512.png" width="112" height="112" alt="" />
              <div>
                <p class="kicker">Isolated Web App</p>
                <h1>Roblox en tu Chromebook</h1>
                <p>Launcher instalable. Abre el sitio oficial dentro de la app, con accesos a inicio, descubrir, avatar y crear.</p>
                <div class="cta">
                  <button type="button" class="btn" id="launch">Abrir Roblox</button>
                  <button type="button" class="btn ghost" data-url="https://www.roblox.com/discover">Explorar</button>
                </div>
                <div class="stats"><span><b>IWA</b> firmada</span><span><b>ChromeOS</b> lista</span><span><b>https</b> roblox.com</span></div>
              </div>
            </div>
            <div class="section">Accesos rápidos</div>
            <div class="cards">
              <button type="button" class="card" data-url="https://www.roblox.com/home"><i></i><span>Casa</span><strong>Inicio</strong><em>Amigos y continuar</em></button>
              <button type="button" class="card" data-url="https://www.roblox.com/discover"><i></i><span>Jugar</span><strong>Descubrir</strong><em>Experiencias y géneros</em></button>
              <button type="button" class="card" data-url="https://www.roblox.com/charts"><i></i><span>Top</span><strong>Populares</strong><em>Lo más jugado ahora</em></button>
              <button type="button" class="card" data-url="https://www.roblox.com/catalog"><i></i><span>Look</span><strong>Avatar</strong><em>Catálogo y estilo</em></button>
              <button type="button" class="card" data-url="https://www.roblox.com/develop"><i></i><span>Studio</span><strong>Crear</strong><em>Tus experiencias</em></button>
              <button type="button" class="card" data-url="https://www.roblox.com/trades"><i></i><span>Items</span><strong>Intercambios</strong><em>Limiteds y valor</em></button>
            </div>
          </section>
          <iframe id="frame" title="Roblox" hidden allow="fullscreen; gamepad; pointer-lock"></iframe>
        </main>
        <footer id="status">Listo · solo https://*.roblox.com</footer>
      </div>
    </div>
    <script>
      const frame = document.getElementById("frame");
      const splash = document.getElementById("splash");
      const statusEl = document.getElementById("status");
      const urlInput = document.getElementById("url");
      const HOME = "https://www.roblox.com/home";
      function clock() {
        document.getElementById("clock").textContent = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      }
      clock();
      setInterval(clock, 10000);
      function allowed(url) {
        try {
          const u = new URL(url);
          return u.protocol === "https:" && /(^|\.)roblox\.com$/.test(u.hostname);
        } catch (e) { return false; }
      }
      function dest(value) {
        const q = (value || "").trim();
        if (!q) return HOME;
        if (/^https?:/i.test(q)) return q;
        return "https://www.roblox.com/discover/?Keyword=" + encodeURIComponent(q);
      }
      function load(url) {
        if (!allowed(url)) { statusEl.textContent = "Solo se permite https://*.roblox.com"; return; }
        splash.hidden = true;
        frame.hidden = false;
        frame.src = url;
        urlInput.value = url;
        statusEl.textContent = "Cargando " + url;
        document.querySelectorAll(".rail button[data-url]").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-url") === url);
        });
      }
      document.getElementById("launch").onclick = function () { load(HOME); };
      document.getElementById("home-btn").onclick = function () {
        frame.hidden = true;
        frame.removeAttribute("src");
        splash.hidden = false;
        statusEl.textContent = "Inicio";
      };
      document.querySelectorAll("[data-url]").forEach(function (el) {
        el.addEventListener("click", function (ev) { ev.preventDefault(); load(el.getAttribute("data-url")); });
      });
      document.getElementById("go-form").onsubmit = function (ev) { ev.preventDefault(); load(dest(urlInput.value)); };
    </script>
  </body>
</html>
